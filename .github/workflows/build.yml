name: Build all ports

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: targets
        run: python -B ports/ci_build.py matrix >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.matrix.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install JDK 17
        id: java17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install JDK 21
        id: java21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install JDK 25
        id: java25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify release JAR
        env:
          MUSICPLAYER_JAVA17_HOME: ${{ steps.java17.outputs.path }}
          MUSICPLAYER_JAVA21_HOME: ${{ steps.java21.outputs.path }}
          MUSICPLAYER_JAVA25_HOME: ${{ steps.java25.outputs.path }}
        run: python -B ports/ci_build.py build --job '${{ matrix.id }}'
      - name: Upload release JAR and checksums
        uses: actions/upload-artifact@v4
        with:
          name: music-player-port.11.1-${{ matrix.id }}
          path: |
            dist/port.11.1/*.jar
            dist/port.11.1/*manifest.json
            dist/port.11.1/*SHA256SUMS*
          if-no-files-found: error
          retention-days: 7
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.id }}
          path: .cache/ci-logs/
          if-no-files-found: ignore
          retention-days: 7
