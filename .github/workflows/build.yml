name: build

on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build
        run: ./gradlew clean build --no-daemon
      - name: Upload release JARs
        uses: actions/upload-artifact@v4
        with:
          name: music-player-all-supported
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-thin.jar
            legacy-old/build/libs/*.jar
            !legacy-old/build/libs/*-sources.jar
            !legacy-old/build/libs/*-dev*.jar
            legacy-new/build/libs/*.jar
            !legacy-new/build/libs/*-sources.jar
            !legacy-new/build/libs/*-dev*.jar
