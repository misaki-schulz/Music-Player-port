pluginManagement {
 repositories {
  maven {
   url = "https://maven.minecraftforge.net"
   content { includeGroupByRegex "net[.]minecraftforge.*" }
  }
  maven {
   url = "https://maven.neoforged.net/releases"
   content { includeGroupByRegex "net[.]neoforged.*" }
  }
  gradlePluginPortal()
  mavenCentral()
 }
}
rootProject.name = "Music-Player-native-port"
def sourceGroup = new Properties()
file("gradle.properties").withInputStream { sourceGroup.load(it) }
include("musicplayer-lavaplayer-api", "musicplayer-lavaplayer")
project(":musicplayer-lavaplayer-api").projectDir = file("../${sourceGroup.source_group}/musicplayer-lavaplayer-api")
project(":musicplayer-lavaplayer").projectDir = file("../${sourceGroup.source_group}/musicplayer-lavaplayer")
