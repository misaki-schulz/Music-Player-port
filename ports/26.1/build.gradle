// Modified for Minecraft 26.2 by misaki-schulz; see NOTICE.

plugins {
	id "net.fabricmc.fabric-loom" version "${loom_version}"
	id "com.gradleup.shadow" version "9.6.1"
}

def mcVersion = (findProperty("targetVersion") ?: minecraft_version).toString()
def fabricApis = ["26.1": "0.145.1+26.1", "26.1.1": "0.145.4+26.1.1", "26.1.2": "0.155.3+26.1.2"]
if (!fabricApis.containsKey(mcVersion)) throw new GradleException("Unsupported 26.1 group target: ${mcVersion}")
def apiVersion = fabricApis[mcVersion]
group = project.maven_group
version = "2.7.1.351+mc${mcVersion}.port.9"
layout.buildDirectory = layout.projectDirectory.dir("build/${mcVersion}")

base {
	archivesName = "music_player-fabric-${mcVersion}"
}

repositories {
	maven {
		url = "https://repo.u-team.info"
	}
	mavenCentral()
}

sourceSets {
	main {
		java {
			srcDirs = ["common/src/common/java", "fabric/src/main/java"]
		}
		resources {
			srcDirs = ["common/src/common/resources", "common/src/common_generated/resources", "fabric/src/main/resources"]
		}
	}
}

configurations {
	shade
	implementation.extendsFrom(shade)
}

dependencies {
	minecraft "com.mojang:minecraft:${mcVersion}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${apiVersion}"

	compileOnly project(":musicplayer-lavaplayer-api")
	runtimeOnly project(":musicplayer-lavaplayer-api")
	shade("net.harawata:appdirs:1.4.0") {
		transitive = false
	}
}

loom {
	runs {
		client {
			client()
			runDir "run/client"
			def playerBuild = project(":musicplayer-lavaplayer").layout.buildDirectory.get().asFile
			def devDependencies = [
				new File(playerBuild, "libs").canonicalPath,
				new File(playerBuild, "dependencies").canonicalPath
			].join(File.pathSeparator)
			property "musicplayer.dev", devDependencies
		}
	}
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft", mcVersion
	inputs.property "fabric_api", apiVersion
	inputs.property "loader", loader_version

	filesMatching("fabric.mod.json") {
		def versionValue = project.version.toString()
		filter { String line ->
			line.replace('${version}', versionValue).replace('${minecraft}', mcVersion).replace('${fabric_api}', apiVersion).replace('${loader}', loader_version)
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
	options.encoding = "UTF-8"
	options.compilerArgs.addAll(["-Xmaxerrs", "500"])
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

def addLegalFiles = { task ->
	task.from(rootProject.file("LICENSE")) {
		rename { "LICENSE_Music-Player" }
	}
	task.from(rootProject.file("NOTICE"))
	task.from(rootProject.file("THIRD_PARTY_LICENSES")) {
		into "THIRD_PARTY_LICENSES"
	}
}

tasks.named("shadowJar") {
	dependsOn project(":musicplayer-lavaplayer-api").tasks.named("classes")
	dependsOn project(":musicplayer-lavaplayer").tasks.named("assemble")

	archiveClassifier = ""
	configurations = [project.configurations.shade]

	from project(":musicplayer-lavaplayer-api").sourceSets.main.output
	from project(":musicplayer-lavaplayer").file("src/main/resources/LICENSE-DEPENDENCIES")

	into("dependencies") {
		def playerBuild = project(":musicplayer-lavaplayer").layout.buildDirectory
		from playerBuild.dir("libs").map { it.file("musicplayer-lavaplayer.jar.packed") }
		from playerBuild.dir("dependencies")
	}

	relocate "net.harawata.appdirs", "info.u_team.music_player.shade.net.harawata.appdirs"
	exclude "META-INF/maven/**"
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	addLegalFiles(delegate)
}

tasks.named("jar") {
	archiveClassifier = "thin"
	addLegalFiles(delegate)
}

tasks.named("sourcesJar") {
	addLegalFiles(delegate)
}

apply from: "${rootDir}/../pack-format.gradle"

tasks.named("assemble") {
	dependsOn tasks.named("shadowJar")
}
