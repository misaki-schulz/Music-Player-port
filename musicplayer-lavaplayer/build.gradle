// Modified for Minecraft 26.2 by misaki-schulz; see NOTICE.
plugins {
	id "java"
}

sourceSets {
	main {
		java
		resources
	}
	test_player {
		java
		resources
	}
}

sourceSets.test_player.compileClasspath += sourceSets.main.output
sourceSets.test_player.runtimeClasspath += sourceSets.main.output

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
	options.release = 21
	options.encoding = "UTF-8"
}

configurations {
	musicplayer
	musicplayer.exclude group: "commons-logging", module: "commons-logging"
	implementation.extendsFrom(musicplayer)
	test_playerImplementation.extendsFrom(implementation)
	test_playerRuntimeOnly.extendsFrom(runtimeOnly)
}

evaluationDependsOn(":musicplayer-lavaplayer-api")

tasks.named("jar").configure {
	archiveExtension.set(archiveExtension.get() + ".packed")
	
	exclude("LICENSE-DEPENDENCIES")
}

tasks.register("deleteOldDependencies", Delete) {
	delete layout.buildDirectory.dir("dependencies").map { it.asFileTree }
}

tasks.register("copyNewDependencies", Copy) {
	dependsOn tasks.named("deleteOldDependencies")
	
	from configurations.musicplayer.copyRecursive().with {
		exclude group: "org.slf4j", module: "slf4j-api"
	}
	into layout.buildDirectory.dir("dependencies")
	rename { fileName ->
		fileName += ".packed"
	}
}

tasks.named("assemble").configure {
	dependsOn tasks.named("copyNewDependencies")
}

repositories {
	maven {
		url = "https://repo.u-team.info"
	}
	maven {
		url = "https://maven.arbjerg.dev/releases"
	}
	maven {
		url = "https://maven.topi.wtf/releases"
	}
	mavenCentral()
	maven {
		url = "https://jitpack.io"
	}
}

dependencies {
	musicplayer "net.hycrafthd.lavaplayer:lavaplayer:2.2.4-fix-j8"
	musicplayer "dev.lavalink.youtube:v2:1.18.1"
	musicplayer "dev.arbjerg:lavadsp:0.7.8"
	musicplayer "com.github.topi314.lavasrc:lavasrc:4.8.1"
	musicplayer "com.github.topi314.lavasrc:lavasrc-protocol:4.8.1"
	
	musicplayer "org.slf4j:jcl-over-slf4j:2.0.17"
	implementation "org.slf4j:slf4j-simple:2.0.17"
	
	implementation project(":musicplayer-lavaplayer-api")
}

tasks.register("lifecycleSmokeTest", JavaExec) {
	dependsOn tasks.named("test_playerClasses")
	classpath = sourceSets.test_player.runtimeClasspath
	mainClass = "info.u_team.music_player.lavaplayer.LifecycleSmokeTest"
	maxHeapSize = "256m"
}
